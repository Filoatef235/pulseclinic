services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pulseclinic
      POSTGRES_USER: pulseclinic
      POSTGRES_PASSWORD: pulseclinic
    ports:
      - "5432:5432"
    volumes:
      - pulseclinic_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulseclinic -d pulseclinic"]
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  pulseclinic_pg:
