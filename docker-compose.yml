services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pulseclinic
      POSTGRES_USER: pulseclinic
      POSTGRES_PASSWORD: pulseclinic
    ports:
      - "5432:5432"
    volumes:
      - pulseclinic_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulseclinic -d pulseclinic"]
      interval: 3s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: prod,demo
      DATABASE_URL: jdbc:postgresql://postgres:5432/pulseclinic
      DATABASE_USERNAME: pulseclinic
      DATABASE_PASSWORD: pulseclinic
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env before starting Docker Compose}
      PULSECLINIC_AUTH_SECURE_COOKIES: "false"
      PULSECLINIC_CORS_ORIGINS: http://localhost:3000
      PULSECLINIC_UPLOAD_DIR: /app/uploads
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-PulseClinic <onboarding@resend.dev>}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:3000}
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pulseclinic_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pulseclinic_pg:
  pulseclinic_uploads:
